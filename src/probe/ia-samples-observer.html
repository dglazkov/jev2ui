<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IA sample sweeps</title><style>
:root{color-scheme:light dark;font:15px/1.5 system-ui;color:light-dark(#203029,#e4ede6);background:light-dark(#f4f6f3,#111a16)}body{margin:0;padding:28px;max-width:1600px;margin:auto}h1{margin:0}a{color:light-dark(#126445,#8bddb5)}select{font:inherit;padding:8px;max-width:100%}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;background:light-dark(white,#1a2720)}th,td{text-align:left;vertical-align:top;padding:14px;border-bottom:1px solid #80908044}th{white-space:nowrap}td:first-child{min-width:200px;max-width:350px}small{display:block;opacity:.8}#summary{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}.card{border:1px solid #80908066;border-radius:8px;padding:16px}p{max-width:1000px}.good{color:light-dark(#126445,#8bddb5)}.bad{color:light-dark(#af471f,#ffad90)}@media(max-width:650px){body{padding:16px}}
</style></head><body><h1>IA sample sweeps</h1><p>Every sentence from <code>src/probe/custom.ts</code>. Prompt-only IA plans, no generated mocks or Gemini calls. Both variants reuse the same first-screen plan. Structural closure and model critique are reported separately.</p><p><a href="/">Map observer</a></p><label>Sweep <select id="suites"></select></label><label><input id="intermediate" type="checkbox"> Show intermediate experiments</label><p id="status">Connecting…</p><div id="summary"></div><div class="scroll"><table><thead id="head"><tr><th>Prompt</th><th>Original vocabulary</th><th>Neutral vocabulary</th></tr></thead><tbody id="rows"></tbody></table></div><script type="module">
const $=id=>document.getElementById(id),el=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};let selected=location.hash.slice(1),busy=false;
$('intermediate').onchange=()=>void poll();$('suites').onchange=()=>{selected=$('suites').value;location.hash=selected;void poll()};window.addEventListener('hashchange',()=>{selected=location.hash.slice(1);void poll()});
async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${url}`);return r.json()}
async function poll(){if(busy)return;busy=true;try{const {suites}=await get('/api/suites');$('suites').replaceChildren(...suites.map(s=>{const o=el('option',s.id);o.value=s.id;return o}));selected ||= suites[0]?.id;if(!selected)return;$('suites').value=selected;const suite=await get(`/api/suites/${selected}`);const allVariants=Object.keys(suite.variants),variants=$('intermediate').checked?allVariants:[...new Set(['baseline',allVariants.at(-1)])].filter(v=>suite.variants[v]);$('summary').replaceChildren();for(const [name,v] of Object.entries(suite.variants).filter(([name])=>variants.includes(name))){const c=el('div');c.className='card';c.append(el('strong',`${name} · ${v.status}`),el('small',`${v.resolved??'…'}/${v.total??suite.rows.length} structurally closed · ${v.reviewed??'…'} model critiques passed · ${v.failed??0} execution failures`));if(v.audit)c.append(el('small',`Same-rubric audit: ${v.audit.passed}/${v.audit.total} all checks passed · task ${v.audit.checks.task} · surrounding app ${v.audit.checks.surrounding} · domain ${v.audit.checks.domain} · identity ${v.audit.checks.identity}`));$('summary').append(c)}const header=el('tr');header.append(el('th','Prompt'),...variants.map(v=>el('th',v)));$('head').replaceChildren(header);$('rows').replaceChildren(...suite.rows.map(row=>{const tr=el('tr'),p=el('td',`${row.index+1}. ${row.prompt}`);tr.append(p);for(const name of variants){const cell=el('td'),r=row[name];if(!r)cell.textContent='Not run';else{const link=el('a',r.status==='running'?'Running…':r.resolved?'Resolved map':'Inspect failure');link.href=`/#${r.runId}`;cell.append(link);if(r.error)cell.append(el('small',r.error));if(r.nodes)cell.append(el('small',r.nodes.map(n=>n.id==='first'?'Requested screen':n.label).join(' · ')));if(r.calls)cell.append(el('small',`${r.destinations} destinations · ${Math.round(r.wallMs)} ms total · ${r.calls.decisions} decision calls · ${r.calls.generation} generation calls`));if(r.audit){cell.append(el('small',`Same-rubric audit: ${Object.entries(r.audit.checks).map(([key,a])=>`${key}: ${a.choice}`).join(' · ')}`))}if(r.reviewed!==undefined){const review=el('small',r.reviewed?'Model critique passed':`Review notes: ${(r.findings??[]).map(f=>f.detail).join(' ')}`);review.className=r.reviewed?'good':'bad';cell.append(review)}}tr.append(cell)}return tr}));$('status').textContent=`Updated ${new Date().toLocaleTimeString()} · ${suite.rows.length} prompts. A passed model critique is not independent proof of semantic correctness.`}catch(e){$('status').textContent=e.message}finally{busy=false}}
await poll();setInterval(poll,1500);
</script></body></html>
